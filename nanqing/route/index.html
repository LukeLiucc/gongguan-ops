<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>南青開幕典禮入場動線圖</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"><style id="css">:root{
  /* 版面：上方標題列＋樓層分頁，中間左圖右人力表，下方現場照片 */
  --bg:#F3F6FA; --panel:#FFFFFF; --ink:#16233A; --muted:#5B6B82; --line:#D6DEE9;
  --accent:#0B6FB8; --accent-ink:#FFFFFF; --warn:#C8102E; --soft:#E7F0F9;
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1724;--panel:#172233;--ink:#E8EEF6;--muted:#9AA9BD;--line:#2A3A52;--accent:#4FA8E8;--accent-ink:#0F1724;--warn:#FF6B7F;--soft:#1E2E45;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1724;--panel:#172233;--ink:#E8EEF6;--muted:#9AA9BD;--line:#2A3A52;--accent:#4FA8E8;--accent-ink:#0F1724;--warn:#FF6B7F;--soft:#1E2E45;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55}
#root{max-width:1320px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
header.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
header.top .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:4px 10px;font-size:13px;font-weight:500}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.dirty{color:var(--warn);font-weight:700}
nav.floors{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:8px}
nav.floors button{display:flex;gap:10px;align-items:center;text-align:left;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px}
nav.floors button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
nav.floors .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:900;display:grid;place-items:center}
nav.floors button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
nav.floors b{display:block;font-size:16px}
nav.floors small{color:var(--muted);font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tools .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 2px 0 6px}
.tools .lbl:first-child{margin-left:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.stagewrap{background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:hidden}
#stage{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.edit #stage [data-id],.edit #stage [data-h]{cursor:grab}
.edit #stage [data-rt]{cursor:move}
.view #stage [data-photo]{cursor:zoom-in}
.cap{margin:6px 4px 0;font-size:12.5px;color:#5B6B82}
aside.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font-size:12.5px;color:var(--muted);font-weight:500}
.insp{display:flex;flex-direction:column;gap:8px}
.insp label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:700}
.insp input,.insp select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:14px;font-weight:500}
.insp .row{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:13px;color:var(--muted);margin:0}
table.staff{width:100%;border-collapse:collapse;font-size:13.5px}
table.staff th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:0 6px 6px 0;border-bottom:1px solid var(--line)}
table.staff td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.staff td.c{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:900;font-size:16px;text-align:center}
table.staff .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
table.staff .pn{font-weight:700}
table.staff .tk{color:var(--muted);font-size:12.5px;margin-top:2px}
table.staff .tm{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.step{display:inline-flex;gap:4px;align-items:center;margin-top:4px}
.step button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:900;line-height:1;padding:0}
.total{display:flex;justify-content:space-between;margin-top:10px;font-weight:900;font-variant-numeric:tabular-nums}
.total span{color:var(--muted);font-weight:500}
[contenteditable="true"]{border-radius:4px;outline:1px dashed transparent;outline-offset:2px}
.edit [contenteditable="true"]:hover{outline-color:var(--line)}
.edit [contenteditable="true"]:focus{outline:2px solid var(--accent);background:var(--bg)}
.photos h2{margin:6px 0 10px;font-size:17px;font-weight:900}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pcard.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pcard .ph{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;position:relative}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pcard .drop{width:100%;height:100%;border:2px dashed var(--line);border-radius:0;background:transparent;color:var(--muted);font-weight:700;display:grid;place-items:center;text-align:center;padding:12px}
.pcard .drop:hover{border-color:var(--accent);color:var(--accent)}
.pcard .pact{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.pcard .pb{padding:10px 12px 12px;display:flex;gap:10px;align-items:flex-start}
.pcard .num{flex:none;width:26px;height:26px;border-radius:50%;background:#111827;color:#fff;font-weight:900;display:grid;place-items:center;font-size:13px}
.pcard .tt{font-weight:700}
.pcard .nt{font-size:13px;color:var(--muted);min-height:1.2em}
.edit .nt:empty::before{content:attr(data-ph);opacity:.7}
dialog.lb{border:0;padding:0;background:transparent;max-width:min(96vw,1200px);max-height:94vh}
dialog.lb::backdrop{background:rgba(8,14,24,.82)}
dialog.lb img{display:block;max-width:100%;max-height:84vh;border-radius:8px;margin:0 auto}
dialog.lb p{color:#fff;text-align:center;margin:10px 0 0;font-weight:700}
.view .editonly{display:none !important}
@media (max-width:980px){.main{grid-template-columns:1fr}nav.floors{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none !important}}

.back{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;font-weight:700;margin-bottom:4px}
.back:hover{text-decoration:underline}

  S.cats.forEach(function(c){h+='<button class="btn sm" data-act="addroute:'+c.id+'"><span style="display:inline-block;width:14px;height:4px;border-radius:2px;background:'+c.color+';vertical-align:middle;margin-right:6px"></span>'+esc(c.name)+'</button>';});
  h+='<span class="lbl">底圖</span><button class="btn sm" data-act="base">更換這層平面圖</button>'+(f.base?'<button class="btn sm" data-act="unbase">改回示意圖</button>':'')+'</div>';
  h+='<div class="main"><div><div class="stagewrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+f.w+' '+(f.h+70*K(f))+'" role="img" aria-label="'+esc(f.name)+'動線圖"><g id="base">'+baseSvg(f)+'</g><g id="ov"></g></svg>';
  h+='<p class="cap" data-bind="floor.note"'+ce()+'>'+esc(f.note||'')+'</p></div></div>';
  h+='<aside class="side"><div class="card editonly" id="insp"></div><div class="card" id="staff"></div></aside></div>';
  h+='<section class="photos" id="photos"></section>';
  h+='<dialog class="lb" id="lb"><img alt=""><p></p></dialog><input type="file" id="file" accept="image/*" hidden>';
  root.innerHTML=h;
  renderOv();renderInsp();renderStaff();renderPhotos();setStatus();
}
function renderInsp(){
  var el=document.getElementById('insp');if(!el)return;
  var s=ui.sel,h='<h2>選取的物件</h2><div class="insp">';
  if(s&&s.t==='item'&&item(s.id)){
    var it=item(s.id);
    if(it.type==='person'){
      h+='<label>崗位<select id="f-post" data-f="post">'+S.posts.filter(function(p){return p.floor===it.floor;}).map(function(p){return '<option value="'+p.id+'"'+(p.id===it.post?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select></label>';
      h+='<label>姓名（顯示在小人下方，可留空）<input id="f-name" data-f="name" value="'+esc(it.name||'')+'"></label>';
    }else if(it.type==='photo'){
      h+='<label>照片標題<input id="f-title" data-f="title" value="'+esc(it.title||'')+'"></label>';
    }else{
      h+='<label>'+TYPES[it.type].n+'文字<input id="f-text" data-f="text" value="'+esc(it.text||'')+'"></label>';
    }
    h+='<div class="row"><button class="btn sm danger" data-act="del">刪除</button></div>';
  }else if(s&&(s.t==='node'||s.t==='route')&&route(s.r)){
    var r=route(s.r);
    h+='<label>動線類別<select id="f-cat" data-f="cat">'+S.cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===r.cat?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select></label>';
    h+='<div class="row">'+(s.t==='node'&&r.pts.length>2?'<button class="btn sm" data-act="delnode">刪除這個轉折點</button>':'')+'<button class="btn sm danger" data-act="delroute">刪除整條動線</button></div>';
    h+='<p class="hint">拖圓點改路線，拖線段整條移動，在線上連點兩下加轉折點。</p>';
  }else{
    h+='<p class="hint">點圖上的小人、標籤或動線來修改。拖曳可移動位置，在動線上連點兩下可加轉折點，按 Delete 可刪除選取的物件。</p>';
  }
  el.innerHTML=h+'</div>';
}
function renderStaff(){
  var el=document.getElementById('staff');if(!el)return;
  var f=fl(),ed=isEdit(),tot=S.items.filter(function(i){return i.type==='person';}).length;
  var h='<h2>'+esc(f.name)+' 人力配置<span data-bind="meta.time"'+ce()+'>'+esc(S.meta.time)+'</span></h2>';
  h+='<table class="staff"><thead><tr><th>崗位與工作</th><th style="text-align:center">人數</th></tr></thead><tbody>';
  S.posts.filter(function(p){return p.floor===f.id;}).forEach(function(p){
    var t=team(p.team);
    h+='<tr><td><div><span class="dot" style="background:'+t.color+'"></span><span class="pn" data-bind="post:'+p.id+'.name"'+ce()+'>'+esc(p.name)+'</span>';
    h+=ed?' <select class="tm" aria-label="組別" data-postteam="'+p.id+'">'+S.teams.map(function(x){return '<option value="'+x.id+'"'+(x.id===p.team?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select>':'<span class="tm">'+esc(t.name)+'</span>';
    h+='</div><div class="tk" data-bind="post:'+p.id+'.task"'+ce()+'>'+esc(p.task)+'</div></td>';
    h+='<td class="c">'+count(p.id)+'<div class="step editonly"><button data-act="post-:'+p.id+'" aria-label="減一人">−</button><button data-act="post+:'+p.id+'" aria-label="加一人">＋</button></div>'+(ed&&!count(p.id)?'<div><button class="btn sm danger" data-act="delpost:'+p.id+'">刪除</button></div>':'')+'</td></tr>';
  });
  h+='</tbody></table><div class="editonly" style="margin-top:8px"><button class="btn sm" data-act="addpost">新增崗位</button></div>';
  h+='<div class="total"><span>本層 '+floorCount(f.id)+' 人</span>全場合計 '+tot+' 人</div>';
  el.innerHTML=h;
}
function renderPhotos(){
  var el=document.getElementById('photos');if(!el)return;
  var f=fl(),ed=isEdit(),n=0,h='',any=false;
  items(f.id,'photo').forEach(function(p){
    n++;if(!p.img&&!ed)return;any=true;
    h+='<article class="pcard" id="pc-'+p.id+'"><div class="ph">';
    if(p.img)h+='<img src="'+p.img+'" alt="'+esc(p.title)+'" data-act="zoom:'+p.id+'"><div class="pact editonly"><button class="btn sm" data-act="upload:'+p.id+'">更換</button><button class="btn sm danger" data-act="rmphoto:'+p.id+'">移除照片</button></div>';
    else h+='<button class="drop" data-act="upload:'+p.id+'">點這裡放上現場照片</button>';
    h+='</div><div class="pb"><span class="num">'+n+'</span><div style="flex:1;min-width:0"><div class="tt" data-bind="item:'+p.id+'.title"'+ce()+'>'+esc(p.title)+'</div><div class="nt" data-ph="補充說明" data-bind="item:'+p.id+'.note"'+ce()+'>'+esc(p.note||'')+'</div></div></div></article>';
  });
  el.innerHTML=any?'<h2>'+esc(f.name)+' 現場照片</h2><div class="pgrid">'+h+'</div>':'';
}

/* ---------- 編輯動作 ---------- */
function addItem(type){
  var f=fl(),it={id:uid(),floor:f.id,type:type,x:Math.round(f.w/2+(Math.random()-0.5)*80),y:Math.round(f.h/2+(Math.random()-0.5)*80)};
  if(type==='photo'){it.title='現場照片';it.note='';it.img='';}
  else if(type==='closed')it.text='封閉';
  else it.text=TYPES[type].n;
  S.items.push(it);ui.sel={t:'item',id:it.id};touch();renderOv();renderInsp();renderPhotos();
}
function addPerson(pid){
  var f=fl(),k=K(f),mine=S.items.filter(function(i){return i.type==='person'&&i.post===pid;}),last=mine[mine.length-1];
  var it={id:uid(),floor:f.id,type:'person',post:pid,name:'',x:last?Math.min(f.w-20,last.x+30*k):f.w/2,y:last?last.y:f.h/2};
  S.items.push(it);ui.sel={t:'item',id:it.id};touch();render();
}
function delSel(){
  var s=ui.sel;if(!s)return;
  if(s.t==='item')S.items=S.items.filter(function(i){return i.id!==s.id;});
  else S.routes=S.routes.filter(function(r){return r.id!==s.r;});
  ui.sel=null;touch();render();
}
function insertNode(r,p){
  var best=0,bd=1e18;
  for(var i=0;i<r.pts.length-1;i++){
    var a=r.pts[i],b=r.pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/L));
    var qx=a[0]+t*dx,qy=a[1]+t*dy,dd=(p.x-qx)*(p.x-qx)+(p.y-qy)*(p.y-qy);
    if(dd<bd){bd=dd;best=i;}
  }
  r.pts.splice(best+1,0,[Math.round(p.x),Math.round(p.y)]);
  ui.sel={t:'node',r:r.id,i:best+1};
}
function loadImg(file,max,cb){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    var x=c.getContext('2d');x.fillStyle='#FFFFFF';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);var fb=function(){cb(c.toDataURL('image/jpeg',0.82));};
    if(STORE&&c.toBlob){ui.msg='圖片上傳中';setStatus();c.toBlob(function(b){if(!b){fb();return;}STORE.upload(b).then(function(url){ui.msg='';cb(url);}).catch(function(){ui.msg='';fb();});},'image/jpeg',0.82);}else fb();
  };
  im.onerror=function(){URL.revokeObjectURL(u);ui.msg='這個檔案不是可讀取的圖片，請改用 JPG 或 PNG';setStatus();};
  im.src=u;
}
function setPath(path,val){
  var m;
  if(path==='meta.title')S.meta.title=val;
  else if(path==='meta.sub')S.meta.sub=val;
  else if(path==='meta.time')S.meta.time=val;
  else if(path==='floor.note')fl().note=val;
  else if((m=/^post:(\w+)\.(\w+)$/.exec(path))){var p=post(m[1]);if(p)p[m[2]]=val;}
  else if((m=/^item:(\w+)\.(\w+)$/.exec(path))){var it=item(m[1]);if(it)it[m[2]]=val;}
}
function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,'\\u003c');
  var close='<'+'/script>';
  return '<!DOCTYPE html>\n<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(S.meta.title)+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">'+
    '<style id="css">'+document.getElementById('css').textContent+'</style></head><body><div id="root"></div>'+
    '<script id="state" type="application/json">'+json+close+'<script src="plans.js">'+close+'<script id="app">'+document.getElementById('app').textContent+close+'</body></html>';
}
function save(){
  if(!STORE)return;
  ui.msg='儲存中';setStatus();
  STORE.load().then(function(r){
    var remoteRev=r?(r.rev||0):0;
    if(remoteRev>(S.rev||0)&&!window.confirm('你編輯的這段時間，有其他人存過新版本。\n按「確定」用你的版本蓋過去；按「取消」先不存，你的修改會留在畫面上。')){ui.msg='沒有儲存';setStatus();return null;}
    S.rev=Math.max(remoteRev,S.rev||0)+1;S.savedAt=new Date().toISOString();
    return STORE.save(S).then(function(){dirty=false;try{localStorage.removeItem(KEY+'-draft');}catch(e){}ui.msg='已儲存';setStatus();});
  }).catch(function(){ui.msg='儲存沒有成功，請確認網路後再按一次儲存';setStatus();});
}
function onRemote(r){
  if(!r||(r.rev||0)<=(S.rev||0))return;
  if(dirty||drag){ui.msg='其他人剛存了新版本，你按儲存時會詢問要不要蓋過去';setStatus();return;}
  var a=document.activeElement;if(a&&(a.isContentEditable||a.tagName==='INPUT'))return;
  S=r;ui.sel=null;if(!S.floors.some(function(f){return f.id===ui.floor;}))ui.floor=S.floors[0].id;render();ui.msg='已更新成其他人剛存的版本';setStatus();
}
function exportPng(){
  if(!downloads)return;
  var f0=fl();
  if(f0.base&&f0.base.indexOf('data:')!==0){fetch(f0.base).then(function(r){return r.blob();}).then(function(b){var fr=new FileReader();fr.onload=function(){doExport(fr.result);};fr.readAsDataURL(b);}).catch(function(){doExport(null);});}
  else doExport(null);
}
function doExport(inl){
  var f=fl(),keep=f.base;if(inl)f.base=inl;
  var H=f.h+70*K(f),W=2400,Hh=Math.round(W*H/f.w);
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+Hh+'" viewBox="0 0 '+f.w+' '+H+'">'+baseSvg(f)+ovSvg(f,true)+'</svg>';
  f.base=keep;
  var im=new Image();
  im.onload=function(){
    var c=document.createElement('canvas');c.width=W;c.height=Hh;c.getContext('2d').drawImage(im,0,0,W,Hh);
    c.toBlob(function(b){
      downloads.save({filename:'南青開幕入場動線_'+f.name.replace(/\s/g,'')+'.png',data:b}).then(function(){ui.msg='圖片已匯出';setStatus();}).catch(function(e){ui.msg=(e&&e.code==='declined')?'':'這個畫面目前無法匯出圖片';setStatus();});
    },'image/png');
  };
  im.onerror=function(){ui.msg='這個畫面目前無法匯出圖片';setStatus();};
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function zoom(id){
  var it=item(id);if(!it||!it.img)return;
  var lb=document.getElementById('lb');lb.querySelector('img').src=it.img;lb.querySelector('p').textContent=it.title||'';
  if(lb.showModal)lb.showModal();
}

/* ---------- 事件 ---------- */
root.addEventListener('click',function(e){
  var lb=e.target.closest('dialog.lb');if(lb){lb.close();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act').split(':'),v=a[1];
  ui.msg='';
  switch(a[0]){
    case 'floor':ui.floor=v;ui.sel=null;try{location.hash=v;}catch(x){}render();break;
    case 'mode':ui.mode=v;ui.sel=null;try{localStorage.setItem(KEY+'-mode',v);}catch(x){}render();break;
    case 'add':addItem(v);break;
    case 'addroute':var f=fl(),r={id:uid(),floor:f.id,cat:v,pts:[[Math.round(f.w*0.3),Math.round(f.h*0.5)],[Math.round(f.w*0.5),Math.round(f.h*0.5)],[Math.round(f.w*0.7),Math.round(f.h*0.5)]]};S.routes.push(r);ui.sel={t:'route',r:r.id};touch();renderOv();renderInsp();break;
    case 'base':fileTarget={kind:'base'};document.getElementById('file').click();break;
    case 'unbase':fl().base='';touch();render();break;
    case 'upload':fileTarget={kind:'photo',id:v};document.getElementById('file').click();break;
    case 'rmphoto':var it=item(v);if(it){it.img='';touch();render();}break;
    case 'zoom':zoom(v);break;
    case 'post+':addPerson(v);break;
    case 'post-':var mine=S.items.filter(function(i){return i.type==='person'&&i.post===v;});if(mine.length){var last=mine[mine.length-1];S.items=S.items.filter(function(i){return i!==last;});ui.sel=null;touch();render();}break;
    case 'addpost':S.posts.push({id:uid(),floor:fl().id,name:'新崗位',team:S.teams[0].id,task:'工作內容'});touch();renderStaff();break;
    case 'delpost':S.posts=S.posts.filter(function(p){return p.id!==v;});touch();renderStaff();break;
    case 'del':delSel();break;
    case 'delnode':if(ui.sel&&ui.sel.t==='node'){var rr=route(ui.sel.r);if(rr&&rr.pts.length>2){rr.pts.splice(ui.sel.i,1);ui.sel={t:'route',r:rr.id};touch();renderOv();renderInsp();}}break;
    case 'delroute':delSel();break;
    case 'save':save();break;
    case 'export':exportPng();break;
  }
});
root.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='file'){
    var file=t.files&&t.files[0],tg=fileTarget;t.value='';if(!file||!tg)return;
    loadImg(file,tg.kind==='base'?2200:1400,function(url){
      if(tg.kind==='base')fl().base=url;else{var it=item(tg.id);if(it)it.img=url;}
      touch();render();
    });
    return;
  }
  if(t.hasAttribute('data-postteam')){var p=post(t.getAttribute('data-postteam'));if(p){p.team=t.value;touch();renderOv();renderStaff();}}
});
root.addEventListener('input',function(e){
  var t=e.target,fld=t.getAttribute&&t.getAttribute('data-f');if(!fld||!ui.sel)return;
  if(ui.sel.t==='item'){var it=item(ui.sel.id);if(!it)return;it[fld]=t.value;touch();renderOv();if(fld==='post')renderStaff();if(fld==='title')renderPhotos();}
  else{var r=route(ui.sel.r);if(r){r[fld]=t.value;touch();renderOv();}}
});
root.addEventListener('focusout',function(e){
  var t=e.target,p=t.getAttribute&&t.getAttribute('data-bind');if(!p||!isEdit())return;
  var v=t.textContent.replace(/\s+/g,' ').trim();setPath(p,v);touch();
  if(p==='meta.title')document.title=v;
  if(/^item:/.test(p))renderInsp();
});
root.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-bind')){e.preventDefault();e.target.blur();}
});
document.addEventListener('keydown',function(e){
  if(!isEdit()||!ui.sel)return;
  var a=document.activeElement,tag=a&&a.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(a&&a.isContentEditable))return;
  if(e.key==='Delete'||e.key==='Backspace'){
    e.preventDefault();
    if(ui.sel.t==='node'){var r=route(ui.sel.r);if(r&&r.pts.length>2){r.pts.splice(ui.sel.i,1);ui.sel={t:'route',r:r.id};touch();renderOv();renderInsp();return;}}
    delSel();
  }
});
function pt(e){
  var svg=document.getElementById('stage'),m=svg.getScreenCTM();if(!m)return {x:0,y:0};
  var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(m.inverse());return {x:p.x,y:p.y};
}
root.addEventListener('pointerdown',function(e){
  var svg=e.target.closest&&e.target.closest('#stage');if(!svg)return;
  if(!isEdit()){var ph=e.target.closest('[data-photo]');if(ph)zoom(ph.getAttribute('data-photo'));return;}
  var p=pt(e),h=e.target.closest('[data-h]'),g=e.target.closest('[data-id]'),rt=e.target.closest('[data-rt]');
  ui.msg='';
  if(h){var a=h.getAttribute('data-h').split(':');ui.sel={t:'node',r:a[0],i:+a[1]};drag={k:'node',moved:false};}
  else if(g){var it=item(g.getAttribute('data-id'));ui.sel={t:'item',id:it.id};drag={k:'item',dx:p.x-it.x,dy:p.y-it.y,moved:false};}
  else if(rt){
    var r=route(rt.getAttribute('data-rt')),now=Date.now();
    if(lastDown.r===r.id&&now-lastDown.t<380){insertNode(r,p);touch();drag={k:'node',moved:false};lastDown={t:0,r:null};}
    else{ui.sel={t:'route',r:r.id};drag={k:'route',lx:p.x,ly:p.y,moved:false};lastDown={t:now,r:r.id};}
  }else{ui.sel=null;drag=null;}
  if(drag){try{svg.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();}
  renderOv();renderInsp();
  if(ui.sel&&ui.sel.t==='item'&&item(ui.sel.id).type==='photo'){
    Array.prototype.forEach.call(document.querySelectorAll('.pcard'),function(c){c.classList.toggle('hl',c.id==='pc-'+ui.sel.id);});
  }
});
root.addEventListener('pointermove',function(e){
  if(!drag)return;
  var f=fl(),p=pt(e),H=f.h;
  function cx(v){return Math.max(0,Math.min(f.w,Math.round(v)));}
  function cy(v){return Math.max(0,Math.min(H,Math.round(v)));}
  if(drag.k==='item'){var it=item(ui.sel.id);if(!it)return;it.x=cx(p.x-drag.dx);it.y=cy(p.y-drag.dy);}
  else if(drag.k==='node'){var r=route(ui.sel.r);if(!r)return;r.pts[ui.sel.i]=[cx(p.x),cy(p.y)];}
  else if(drag.k==='route'){var r2=route(ui.sel.r);if(!r2)return;var dx=p.x-drag.lx,dy=p.y-drag.ly;r2.pts=r2.pts.map(function(q){return [cx(q[0]+dx),cy(q[1]+dy)];});drag.lx=p.x;drag.ly=p.y;}
  drag.moved=true;schedOv();
});
function endDrag(){if(drag&&drag.moved){touch();renderStaff();}drag=null;}
root.addEventListener('pointerup',endDrag);
root.addEventListener('pointercancel',endDrag);
window.addEventListener('hashchange',function(){var b=ui.floor;readHash();if(b!==ui.floor){ui.sel=null;render();}});

downloads={save:function(o){var u=URL.createObjectURL(o.data instanceof Blob?o.data:new Blob([o.data])),el=document.createElement('a');el.href=u;el.download=o.filename;document.body.appendChild(el);el.click();el.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);return Promise.resolve();}};
readHash();
if(STORE){
  artifact={};
  root.innerHTML='<p class="hint" style="padding:40px 0">讀取資料中</p>';
  STORE.load().then(function(r){
    if(r&&r.floors)S=r;
    applyDraft();readHash();render();STORE.watch(onRemote);
  }).catch(function(){artifact=null;render();ui.msg='連不到資料庫，目前顯示的是內建版本，修改不會存到雲端';setStatus();});
}else{applyDraft();render();}
})();
</script></body></html>
